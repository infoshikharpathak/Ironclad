version: "3.8"

services:
  db:
    # pgvector for the policy knowledge base (db/003_policies.sql).
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: anvil_bank
      POSTGRES_USER: anvil
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/18/docker; mount the parent.
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/002_merchants.sql:/docker-entrypoint-initdb.d/02-merchants.sql
      - ./db/003_policies.sql:/docker-entrypoint-initdb.d/03-policies.sql
      - ./db/004_policy_hybrid.sql:/docker-entrypoint-initdb.d/04-policy-hybrid.sql
      - ./db/005_policy_access.sql:/docker-entrypoint-initdb.d/05-policy-access.sql
      - ./db/006_transfer_flags.sql:/docker-entrypoint-initdb.d/06-transfer-flags.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anvil -d anvil_bank"]
      interval: 5s
      timeout: 3s
      retries: 5

  bank-service:
    build: ./bank-service
    environment:
      DATABASE_URL: postgresql://anvil:${DB_PASSWORD:-devpassword}@db:5432/anvil_bank
      # Embeds policy search queries (GET /policies/search).
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # JSON logs for LogScribe (logscribe profile below), shared with agent-service.
      IRONCLAD_LOG_DIR: /logs
    volumes:
      - logs:/logs
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - bank-service

  agent-service:
    build: ./agent-service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANVIL_CONFIG_PATH: /app/anvil-ironclad.yaml
      # The YAML's base_url is localhost:8001, which inside this container is
      # the container itself. Point the agent's tools at the bank service.
      IRONCLAD_BASE_URL: http://bank-service:8001
      # Policy-access key (public + internal) for search_policies; see anvil-ironclad.yaml.
      IRONCLAD_POLICY_KEY: ${IRONCLAD_POLICY_KEY}
      IRONCLAD_LOG_DIR: /logs
    volumes:
      - ./anvil-ironclad.yaml:/app/anvil-ironclad.yaml:ro
      - logs:/logs
    ports:
      - "8002:8002"
    depends_on:
      - bank-service

  # Incident diagnosis: tails both services' logs and analyzes each error
  # against past ones. Off by default: docker compose --profile logscribe up
  logscribe:
    profiles: ["logscribe"]
    build: ./logscribe
    environment:
      IRONCLAD_LOG_DIR: /logs
      # Root-cause analysis and on-call summaries.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Set LOGSCRIBE_ANALYZER=agent_forge to route the analysis through Agent
      # Forge (traced), running on the host at AGENT_FORGE_URL.
      LOGSCRIBE_ANALYZER: ${LOGSCRIBE_ANALYZER:-openai}
      AGENT_FORGE_URL: ${AGENT_FORGE_URL:-http://host.docker.internal:8000}
      HF_HOME: /root/.logscribe/hf  # embedding model cache, kept in the volume
    volumes:
      - logs:/logs:ro
      - logscribe-data:/root/.logscribe  # ChromaDB history, embedding model cache, reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - bank-service
      - agent-service

volumes:
  pgdata:
  logs:
  logscribe-data:
